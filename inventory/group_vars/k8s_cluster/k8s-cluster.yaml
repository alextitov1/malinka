cluster_name: malinka-cl.lan
kube_version: 1.35.2

# Make a copy of kubeconfig on the host that runs Ansible in {{ inventory_dir }}/artifacts
kubeconfig_localhost: true

# Was needed for MetalLB's L2 mode. MetalLB has been retired (LoadBalancer
# announcement now comes from the Cilium BGP control plane) and kube-proxy
# itself is gone, so this is inert -- kept only to avoid a surprise if either is
# ever reintroduced. See inventory/group_vars/k8s_cluster/cilium.yaml
kube_proxy_strict_arp: true


kubeadm_patches:
  - target: kube-apiserver
    type: strategic
    patch:
      spec:
        containers:
          - name: kube-apiserver
            resources:
              requests:
                cpu: "250m"
                memory: "256Mi"
              limits:
                memory: "2Gi"
                # cpu: "1000m"

# CNI (Cilium) configuration lives in cilium.yaml in this same directory.
